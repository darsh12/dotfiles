
set-option -g default-shell $SHELL
run-shell "powerline-daemon -q"

if-shell 'env "$POWERLINE_CONFIG_COMMAND" tmux setup' '' 'run-shell "powerline-config tmux setup"'
# Import custom config
if-shell 'test -s ~/.tmux.custom.conf' 'source-file ~/.tmux.custom.conf'
# Split window, keeping the current folder
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Vim-style pane movement
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start index at 1, keep windows numbered without gaps
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# More scrollback, pass focus events to apps, use the system clipboard
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on

# Rename windows automatically
setw -g automatic-rename on
# ssh -> ssh:<host>, program -> its name, shell prompt -> current folder
setw -g automatic-rename-format '#(~/.dotfiles/tmux/scripts/window-name.sh #{pane_tty} #{pane_current_command} #{pane_current_path})'

# Green window tab when the name starts with ssh: (overrides powerline's colours)
setw -g window-status-format '#[fg=colour244,bg=colour233,nobold,noitalics,nounderscore]  #I#{?window_flags,#F, } #[fg=colour240,bg=colour233,nobold,noitalics,nounderscore] #[default]#{?#{m:ssh:*,#W},#[fg=colour40],}#W   '
setw -g window-status-current-format '#[fg=colour233,bg=#{?#{m:ssh:*,#W},colour28,colour31},nobold,noitalics,nounderscore] #[fg=colour117,bg=#{?#{m:ssh:*,#W},colour28,colour31},nobold,noitalics,nounderscore]#I#F  #[fg=colour231,bg=#{?#{m:ssh:*,#W},colour28,colour31},bold,noitalics,nounderscore]#W #[fg=#{?#{m:ssh:*,#W},colour28,colour31},bg=colour233,nobold,noitalics,nounderscore] '

# Truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# No delay for escape key press
set -sg escape-time 0

#Enable mouse mode
setw -g mouse on

#Enable aggressive resize
setw -g aggressive-resize on

#Tmux script file
bind D source-file ~/.tmux/dev

#Install plugin - install with 'prefix+I'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'		#Enable to copy hightlighted text
set -g @plugin 'wfxr/tmux-fzf-url'		#Pick URLs from the pane with fzf (prefix+u)

#Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
# vim: ft=tmux
